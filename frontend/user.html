<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZPARK | Student Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="data.js"></script>
    <script src="components.js" defer></script>
</head>

<body class="admin-body user-portal-body">

    <ezpark-mobile-header></ezpark-mobile-header>

    <ezpark-sidebar role="student" active="find"></ezpark-sidebar>

    <main class="responsive-main">
        <header class="hide-on-mobile">
            <div>
                <h1>Find Parking</h1>
                <p class="section-subtitle">Pre-book your campus parking space</p>
            </div>
            <div class="user-profile">
                <span>Student Driver</span>
                <div class="avatar"></div>
            </div>
        </header>

        <div class="user-workspace-grid">
            
            <div class="user-control-col">
                <section class="card driver-status-card">
                    <div class="status-header">
                        <span class="card-title">Active Status</span>
                        <span class="status-indicator-dot pulsing"></span>
                    </div>
                    <div class="active-reservation-block">
                        <div class="status-detail">
                            <p class="detail-label">Bay</p>
                            <p class="detail-value text-teal mono-text">A-05</p>
                        </div>
                        <div class="status-detail">
                            <p class="detail-label">Plate</p>
                            <p class="detail-value mono-text">PPP-505</p>
                        </div>
                        <div class="status-detail">
                            <p class="detail-label">Time</p>
                            <p class="detail-value text-alert mono-text">0h 45m</p>
                        </div>
                    </div>
                </section>

                <section class="card zone-selector-card">
                    <span class="card-title">Select Campus Zone</span>
                    <div class="zone-dropdown-wrapper">
                        <select id="zoneSelect" class="global-select">
                            <option value="zone-a">Zone A (North Multi-Level Garage)</option>
                            <option value="zone-b">Zone B (Science Faculty Surface Lot)</option>
                            <option value="zone-c">Zone C (Underground Deck)</option>
                        </select>
                    </div>
                </section>
            </div>

            <div class="user-map-col">
                <section class="card user-map-card">
                    
                    <ezpark-calendar></ezpark-calendar>

                    <div class="map-inner-header">
                        <h3 class="panel-title" id="currentZoneTitle">Zone A</h3>
                        
                        <div class="floor-switcher" id="floorSwitcherContainer">
                            <button class="floor-btn active" data-floor="L1">Level 1</button>
                            <button class="floor-btn" data-floor="L2">Level 2</button>
                            <button class="floor-btn" data-floor="L3">Level 3</button>
                        </div>

                        <div class="map-legend">
                            <span class="legend-item"><span class="dot available"></span> Free</span>
                            <span class="legend-item"><span class="dot occupied"></span> Full</span>
                            <span class="legend-item"><span class="dot reserved"></span> Mine</span>
                        </div>
                    </div>

                    <div class="map-scroll-viewport">
                        <div class="floor-maps-container">
                            
                            <div id="map-L1" class="parking-garage-structure floor-panel active"></div>
                            <div id="map-L2" class="parking-garage-structure floor-panel"></div>
                            <div id="map-L3" class="parking-garage-structure floor-panel"></div>

                        </div>
                    </div>

                    <ezpark-booking-panel></ezpark-booking-panel>

                </section>
            </div>

        </div>
    </main>

    <script>
        // --- 1. THE DATA CONTRACT RESOURCE ---
        // Generates a localized shadow copy of the array hosted safely inside data.js
        let globalParkingDatabase = [...initialParkingData];
        let selectedActiveSpotID = null;

        // --- 2. THE DYNAMIC ENGINE RENDERER ---
        function renderGarageMap(targetLevel) {
            const container = document.getElementById(`map-${targetLevel}`);
            if (!container) return;

            // Clear old HTML nodes completely to prevent layout pile-ups
            container.innerHTML = "";

            // Query our database array for elements matched to the selected floor
            const levelSpots = globalParkingDatabase.filter(spot => spot.level === targetLevel);

            levelSpots.forEach((spot, index) => {
                // Symmetrically insert our layout separator dividing lines
                if (index === 5) {
                    const lane = document.createElement("div");
                    lane.className = "driving-lane-landmark";
                    lane.textContent = "← Central Drive Lane (One Way) — Do Not Block →";
                    container.appendChild(lane);
                }

                // Construct a clean, isolated physical cell block DOM element
                const spotDiv = document.createElement("div");
                spotDiv.className = `parking-spot ${spot.status}`;
                spotDiv.textContent = spot.id;

                // Re-apply the target outline if this specific item matches our active cursor tracking
                if (spot.id === selectedActiveSpotID) {
                    spotDiv.classList.add("selected-target");
                }

                // Only attach pointer selection gestures if the space is unallocated
                if (spot.status === "available") {
                    spotDiv.addEventListener("click", () => {
                        handleSpotSelection(spot.id);
                    });
                }

                container.appendChild(spotDiv);
            });
        }

        // --- 3. RUNTIME UI STATE MANIPULATIONS ---
        function handleSpotSelection(spotId) {
            selectedActiveSpotID = spotId;
            
            // Re-render the visual map array to cleanly apply selection halos instantly
            const currentActiveFloor = document.querySelector('.floor-btn.active').getAttribute('data-floor');
            renderGarageMap(currentActiveFloor);

            // Fetch references to elements inside our custom web component shadows
            const bookingDrawer = document.getElementById('bookingDrawer');
            const drawerBayLabel = document.getElementById('drawerBayLabel');

            if (bookingDrawer && drawerBayLabel) {
                drawerBayLabel.textContent = spotId;
                bookingDrawer.classList.add('active'); 
            }
        }

        // --- 4. NAVIGATION TAB ELEMENT EVENT REGISTRATIONS ---
        const floorButtons = document.querySelectorAll('.floor-btn');
        const floorPanels = document.querySelectorAll('.floor-panel');
        
        floorButtons.forEach(button => {
            button.addEventListener('click', () => {
                floorButtons.forEach(btn => btn.classList.remove('active'));
                floorPanels.forEach(panel => panel.classList.remove('active'));
                
                button.classList.add('active');
                const targetFloor = button.getAttribute('data-floor');
                document.getElementById(`map-${targetFloor}`).classList.add('active');
                
                // Refresh data states seamlessly whenever a floor tab changes
                renderGarageMap(targetFloor);
            });
        });

        // Zone Dropdown Event Hook
        const zoneSelect = document.getElementById('zoneSelect');
        const currentZoneTitle = document.getElementById('currentZoneTitle');
        const floorSwitcherContainer = document.getElementById('floorSwitcherContainer');
        
        zoneSelect.addEventListener('change', (e) => {
            const selectedZoneText = e.target.options[e.target.selectedIndex].text;
            currentZoneTitle.textContent = `${selectedZoneText.split(' (')[0]}`;
            floorSwitcherContainer.style.visibility = e.target.value === 'zone-b' ? 'hidden' : 'visible';
        });

        // --- 5. RUNTIME INITIALIZATION ENGINE BOOTSTRAP ---
        window.addEventListener("DOMContentLoaded", () => {
            // Render initial garage layouts on start loading
            renderGarageMap("L1");
            renderGarageMap("L2");
            renderGarageMap("L3");

            // Safe lookup threshold buffer ensuring web components are registered completely
            setTimeout(() => {
                const submitBookingBtn = document.getElementById('submitBookingBtn');
                const bookingDrawer = document.getElementById('bookingDrawer');
                
                if (submitBookingBtn) {
                    submitBookingBtn.addEventListener('click', () => {
                        alert(`Success! Space ${selectedActiveSpotID} is locked in for your arrival.`);
                        
                        // MUTATION LAYER: Locate item inside array database and switch state flag
                        const databaseEntry = globalParkingDatabase.find(s => s.id === selectedActiveSpotID);
                        if (databaseEntry) {
                            databaseEntry.status = "reserved"; 
                        }

                        // Close out the panel frame and clear tracker references
                        bookingDrawer.classList.remove('active');
                        selectedActiveSpotID = null; 

                        // Trigger visual layout re-render with updated values
                        const currentActiveFloor = document.querySelector('.floor-btn.active').getAttribute('data-floor');
                        renderGarageMap(currentActiveFloor);
                    });
                }
            }, 200);
        });
    </script>
</body>
</html>
